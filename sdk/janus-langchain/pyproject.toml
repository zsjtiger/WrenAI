[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "janus-langchain"
version = "0.2.2"
description = "LangChain and LangGraph integration for Janus AI Core — attach a CLI-prepared Janus project to your agent in three lines."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Janus AI", email = "contact@crossnow.cn" }]
keywords = [
  "janusai", "janus", "langchain", "langgraph", "agent", "ai-agent",
  "sql", "context-layer", "semantic", "mdl", "data-modeling", "analytics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  # Core: provides JanusEngine, MemoryStore, profile resolution, MDL handling.
  "janusai>=0.13.1",
  # langchain >=1.0 ships the recommended `langchain.agents.create_agent`
  # entrypoint. Older `langgraph.prebuilt.create_react_agent` still works
  # but emits deprecation warnings and is scheduled for removal in
  # langgraph 2.0.
  "langchain>=1.0",
  "langchain-core>=0.3",
  "langgraph>=1.0",
  "pydantic>=2",
]

[project.optional-dependencies]
# ── Datasource pass-through extras ────────────────────────────────────────
# Pick the one matching your project's `data_source` (in janus_project.yml).
# These chain through to the matching `janusai[<datasource>]` extra so
# you don't have to install the connector dependency twice.
#
#   pip install "janus-langchain[mysql]"
#   pip install "janus-langchain[mysql,memory]"
#
# DuckDB is built into janusai — no extra needed.
postgres   = ["janusai[postgres]>=0.13.1"]
mysql      = ["janusai[mysql]>=0.13.1"]
bigquery   = ["janusai[bigquery]>=0.13.1"]
snowflake  = ["janusai[snowflake]>=0.13.1"]
clickhouse = ["janusai[clickhouse]>=0.13.1"]
trino      = ["janusai[trino]>=0.13.1"]
mssql      = ["janusai[mssql]>=0.13.1"]
databricks = ["janusai[databricks]>=0.13.1"]
redshift   = ["janusai[redshift]>=0.13.1"]
spark      = ["janusai[spark]>=0.13.1"]
athena     = ["janusai[athena]>=0.13.1"]
oracle     = ["janusai[oracle]>=0.13.1"]

# ── Memory extra ──────────────────────────────────────────────────────────
# Required to use the three memory tools (janus_fetch_context,
# janus_recall_queries, janus_store_query). Pulls in LanceDB and the
# sentence-transformer model deps via janusai.
#
# Without this, the toolkit auto-detects no memory and exposes only the
# three runtime tools.
memory = ["janusai[memory]>=0.13.1"]

# ── Convenience aggregate ─────────────────────────────────────────────────
# Installs every datasource + memory at once. Useful for CI / examples,
# heavyweight for production where you usually want only one datasource.
all = ["janusai[all]>=0.13.1"]

# ── Dev / test deps ───────────────────────────────────────────────────────
dev = [
  "pytest>=8",
  "pytest-mock>=3",
  "ruff>=0.4",
  # Tests run real DuckDB + LanceDB integrations, so memory deps are required.
  "janusai[memory]>=0.13.1",
]

[project.urls]
Homepage      = "https://crossnow.cn"
Documentation = "https://github.com/CrossNow/JanusAI/tree/main/sdk/janus-langchain#readme"
Repository    = "https://github.com/CrossNow/JanusAI"
Issues        = "https://github.com/CrossNow/JanusAI/issues"
Changelog     = "https://github.com/CrossNow/JanusAI/blob/main/sdk/janus-langchain/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/janus_langchain"]

[tool.ruff]
line-length = 88
target-version = "py311"
# ruff 0.16+ formats Markdown code blocks by default; docs are hand-formatted.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "PLC"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Default run skips tests marked `slow` (currently the LanceDB integration
# tests which load a sentence-transformer model, ~30-40s). Run them explicitly
# with `pytest -m slow` or `pytest -m "slow or not slow"` for everything.
addopts = "-ra -m \"not slow\""
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
# Suppress deprecation warnings emitted by langgraph's own internal imports.
# These are not from our code — they fire when `from langgraph.prebuilt import
# ToolNode` triggers langgraph's package init. We cannot fix them upstream-side
# and do not use the deprecated APIs ourselves. Review quarterly per
# sdk/MAINTENANCE.md §3.
filterwarnings = [
  "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
  "ignore:AgentStatePydantic has been moved",
]
