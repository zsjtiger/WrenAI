name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.repository == 'CrossNow/JanusAI' }}
    runs-on: ubuntu-latest
    outputs:
      janus-core-py--release_created: ${{ steps.release.outputs['core/janus-core-py--release_created'] }}
      janus-core-py--tag_name: ${{ steps.release.outputs['core/janus-core-py--tag_name'] }}
      janus-core-py--version: ${{ steps.release.outputs['core/janus-core-py--version'] }}
      janus--release_created: ${{ steps.release.outputs['core/janus--release_created'] }}
      janus--tag_name: ${{ steps.release.outputs['core/janus--tag_name'] }}
      janus--version: ${{ steps.release.outputs['core/janus--version'] }}
      janus-core-wasm--release_created: ${{ steps.release.outputs['core/janus-core-wasm--release_created'] }}
      janus-core-wasm--tag_name: ${{ steps.release.outputs['core/janus-core-wasm--tag_name'] }}
      janus-core-wasm--version: ${{ steps.release.outputs['core/janus-core-wasm--version'] }}
      janus-langchain--release_created: ${{ steps.release.outputs['sdk/janus-langchain--release_created'] }}
      janus-langchain--tag_name: ${{ steps.release.outputs['sdk/janus-langchain--tag_name'] }}
      janus-langchain--version: ${{ steps.release.outputs['sdk/janus-langchain--version'] }}
      janus-pydantic--release_created: ${{ steps.release.outputs['sdk/janus-pydantic--release_created'] }}
      janus-pydantic--tag_name: ${{ steps.release.outputs['sdk/janus-pydantic--tag_name'] }}
      janus-pydantic--version: ${{ steps.release.outputs['sdk/janus-pydantic--version'] }}
      # The three Rust core crates share one version via the linked-versions
      # plugin and release together, so gating on janus-semantic-core covers all.
      janus-semantic-core--release_created: ${{ steps.release.outputs['core/janus-core--release_created'] }}
      janus-semantic-core--tag_name: ${{ steps.release.outputs['core/janus-core--tag_name'] }}
      janus-semantic-core--version: ${{ steps.release.outputs['core/janus-core--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The linked-versions plugin hard-codes the group PR title as
      # "release janus-rust-core libraries" and ignores
      # group-pull-request-title-pattern, so add the shared version here to
      # match the other release PRs. The title still parses under
      # release-please's default pattern when the PR is merged. A failure here
      # must not skip the publish jobs that need this one.
      - name: Add version to janus-rust-core release PR title
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: release-please--branches--main--groups--janus-rust-core
        run: |
          pr=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            exit 0
          fi
          version=$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$REPO/contents/.release-please-manifest.json?ref=$HEAD_BRANCH" \
            --jq '."core/janus-core" // empty')
          if [ -z "$version" ]; then
            echo "::error::core/janus-core missing from the manifest on $HEAD_BRANCH"
            exit 1
          fi
          gh api -X PATCH "repos/$REPO/pulls/$pr" -f title="chore(main): release janus-rust-core $version" --silent

  publish-janus-core-py:
    needs: release-please
    if: needs.release-please.outputs['janus-core-py--release_created'] == 'true'
    uses: ./.github/workflows/publish-janus-core-py.yml
    with:
      version: ${{ needs.release-please.outputs['janus-core-py--version'] }}
      tag_name: ${{ needs.release-please.outputs['janus-core-py--tag_name'] }}
    permissions:
      contents: read
      id-token: write

  # After janus-core-py is published, relock the downstream core/janus SDK against
  # the new engine binding and open a PR. Runs only if publish-janus-core-py
  # succeeded, so we never bump to a version that failed to publish.
  sync-janus-core-py-lock:
    needs: [release-please, publish-janus-core-py]
    if: needs.release-please.outputs['janus-core-py--release_created'] == 'true'
    uses: ./.github/workflows/sync-janus-core-py-lock.yml
    with:
      version: ${{ needs.release-please.outputs['janus-core-py--version'] }}
    permissions:
      contents: write
      pull-requests: write

  publish-janus:
    needs: release-please
    if: needs.release-please.outputs['janus--release_created'] == 'true'
    uses: ./.github/workflows/publish-janus.yml
    with:
      version: ${{ needs.release-please.outputs['janus--version'] }}
      tag_name: ${{ needs.release-please.outputs['janus--tag_name'] }}
    permissions:
      contents: read
      id-token: write

  publish-janus-core-wasm:
    needs: release-please
    if: needs.release-please.outputs['janus-core-wasm--release_created'] == 'true'
    uses: ./.github/workflows/publish-janus-core-wasm.yml
    with:
      version: ${{ needs.release-please.outputs['janus-core-wasm--version'] }}
      tag_name: ${{ needs.release-please.outputs['janus-core-wasm--tag_name'] }}
    permissions:
      contents: read
      id-token: write

  # release-please outputs come from conventional-commit aggregation, not from
  # untrusted issue/PR event payloads, so direct ${{ ... }} interpolation is
  # safe here. Same pattern as the publish jobs above.
  publish-janus-langchain:
    needs: release-please
    if: needs.release-please.outputs['janus-langchain--release_created'] == 'true'
    uses: ./.github/workflows/publish-janus-langchain.yml
    with:
      version: ${{ needs.release-please.outputs['janus-langchain--version'] }}
      tag_name: ${{ needs.release-please.outputs['janus-langchain--tag_name'] }}
    permissions:
      contents: read
      id-token: write

  publish-janus-pydantic:
    needs: release-please
    if: needs.release-please.outputs['janus-pydantic--release_created'] == 'true'
    uses: ./.github/workflows/publish-janus-pydantic.yml
    with:
      version: ${{ needs.release-please.outputs['janus-pydantic--version'] }}
      tag_name: ${{ needs.release-please.outputs['janus-pydantic--tag_name'] }}
    permissions:
      contents: read
      id-token: write

  # Publishes janus-manifest-macro, janus-core-base, and janus-semantic-core to
  # crates.io bottom-up in one run. The three crates are linked to a single
  # version, so a release always bumps all three together — gating on the
  # janus-semantic-core output is sufficient.
  publish-janus-crates:
    needs: release-please
    if: needs.release-please.outputs['janus-semantic-core--release_created'] == 'true'
    uses: ./.github/workflows/publish-janus-crates.yml
    with:
      version: ${{ needs.release-please.outputs['janus-semantic-core--version'] }}
      tag_name: ${{ needs.release-please.outputs['janus-semantic-core--tag_name'] }}
    permissions:
      contents: read
      id-token: write

  # janus-core-py and janus-core-wasm depend on the core crates by path, so
  # release-please never attributes an engine change to them and they would
  # otherwise never release. Relock them against the new core version and open a
  # PR whose fix commit gives them a release line. Deliberately not gated on
  # publish-janus-crates: a crates.io publish failure should not also keep the
  # engine change out of PyPI and npm.
  release-bindings-after-core:
    needs: release-please
    if: needs.release-please.outputs['janus-semantic-core--release_created'] == 'true'
    uses: ./.github/workflows/release-bindings-after-core.yml
    with:
      version: ${{ needs.release-please.outputs['janus-semantic-core--version'] }}
    permissions:
      contents: write
      pull-requests: write
