[package]
name = "janus-manifest-macro"
version = "0.4.0"
edition = "2021"
description = "Proc macro for generating Python-binding manifest types for the Janus semantic engine"
homepage = "https://crossnow.cn"
repository = "https://github.com/CrossNow/JanusAI"
keywords = ["macro", "proc-macro", "pyo3", "janus", "mdl"]
categories = ["development-tools::procedural-macro-helpers"]

[dependencies]
syn = { version = "2.0", default-features = false, features = [
  "printing",
  "parsing",
  "proc-macro",
] }
quote = "1.0"

[lib]
proc-macro = true
name = "manifest_macro"
path = "src/lib.rs"
