[package]
name = "janus-core-base"
version = "0.4.0"
edition = "2021"
description = "Shared MDL manifest types for the Janus semantic engine"
homepage = "https://crossnow.cn"
repository = "https://github.com/CrossNow/JanusAI"
keywords = ["sql", "semantic-layer", "mdl", "manifest", "janus"]
categories = ["database"]

[features]
python-binding = ["dep:pyo3"]
default = []

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"], optional = true }
serde = { version = "1.0.201", features = ["derive", "rc"] }
janus-manifest-macro = { path = "manifest-macro", version = "0.4.0" }
serde_json = { version = "1.0.117" }
serde_with = { version = "3.11.0" }
sqlparser = { version = "0.58.0", features = ["visitor"] }


[lib]
name = "janus_core_base"
path = "src/lib.rs"
