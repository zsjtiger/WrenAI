[package]
name = "janus-core-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for Janus Engine semantic layer (janus-core)"
license = "Apache-2.0"
repository = "https://github.com/Canner/WrenAI"
include = ["/src", "pyproject.toml", "Cargo.toml", "Cargo.lock"]

[lib]
name = "janus_core_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py311"] }
janus-core = { version = "0.4.0", path = "../janus-core/core", package = "janus-semantic-core" }
janus-core-base = { path = "../janus-core-base", features = ["python-binding"] }
datafusion-common = "55.1.0"
base64 = "0.22.1"
futures = "0.3.31"
serde_json = "1.0.117"
thiserror = "2.0.3"
csv = "1.3.0"
serde = { version = "1.0.210", features = ["derive"] }
env_logger = "0.11.5"
log = "0.4.22"
tokio = "1.46.0"

[dev-dependencies]
rstest = "0.23.0"

[build-dependencies]
pyo3-build-config = "0.29.0"

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]
