<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570">
  <style>text { font-family: 'WenQuanYi Zen Hei', 'PingFang SC', 'Microsoft YaHei', sans-serif; }</style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="960" height="570" fill="#ffffff"/>
  <rect x="28" y="96" width="200" height="166" rx="4" ry="4" fill="#56B4E9" fill-opacity="0.12" stroke="#56B4E9" stroke-width="1.5"/>
  <text x="40" y="118" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">把已有仓库纳入</text>
  <text x="40" y="133" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">共享模型</text>
  <text x="40" y="155" text-anchor="start" font-size="8" font-weight="600" fill="#2a7fb8">数据团队</text>
  <text x="40" y="173" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">两个 schema 已有业务数据，</text>
  <text x="40" y="186" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">每张表都草拟为候选模型。</text>
  <text x="40" y="250" text-anchor="start" font-size="8" font-weight="400" fill="#4a4a4a">演示第 1–3 步</text>
  <rect x="254" y="96" width="200" height="166" rx="4" ry="4" fill="#56B4E9" fill-opacity="0.12" stroke="#56B4E9" stroke-width="1.5"/>
  <text x="266" y="118" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">按业务实际用法</text>
  <text x="266" y="133" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">关联表</text>
  <text x="266" y="155" text-anchor="start" font-size="8" font-weight="600" fill="#2a7fb8">数据团队</text>
  <text x="266" y="173" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">根据列名推断关联键。</text>
  <text x="266" y="186" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">遗留的重复表让一处关联</text>
  <text x="266" y="199" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">产生歧义。</text>
  <text x="266" y="250" text-anchor="start" font-size="8" font-weight="400" fill="#4a4a4a">演示第 4–5 步</text>
  <rect x="480" y="96" width="200" height="166" rx="4" ry="4" fill="#E69F00" fill-opacity="0.12" stroke="#CC79A7" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="492" y="118" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">负责人裁定有歧义的关联</text>
  <text x="492" y="140" text-anchor="start" font-size="8" font-weight="600" fill="#E69F00">业务负责人</text>
  <text x="492" y="158" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">负责人保留当前的 companies 表，</text>
  <text x="492" y="171" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">而不是遗留副本。</text>
  <text x="492" y="184" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">记录下来，供之后使用。</text>
  <text x="492" y="250" text-anchor="start" font-size="8" font-weight="400" fill="#4a4a4a">演示第 6 步</text>
  <text x="668" y="250" text-anchor="end" font-size="8" font-weight="400" fill="#4a4a4a">由人决定</text>
  <rect x="706" y="96" width="200" height="166" rx="4" ry="4" fill="#56B4E9" fill-opacity="0.12" stroke="#56B4E9" stroke-width="1.5"/>
  <text x="718" y="118" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">发布，并确认与数据仓库</text>
  <text x="718" y="133" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">没有漂移</text>
  <text x="718" y="155" text-anchor="start" font-size="8" font-weight="600" fill="#2a7fb8">数据团队</text>
  <text x="718" y="173" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">草稿被提升。每个 schema 都与</text>
  <text x="718" y="186" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">数据仓库比对：</text>
  <text x="718" y="199" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">两者都没有漂移。</text>
  <text x="718" y="250" text-anchor="start" font-size="8" font-weight="400" fill="#4a4a4a">演示第 7–8 步</text>
  <rect x="28" y="306" width="200" height="166" rx="4" ry="4" fill="#009E73" fill-opacity="0.12" stroke="#009E73" stroke-width="1.5"/>
  <text x="40" y="328" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">分析师提出业务问题</text>
  <text x="40" y="350" text-anchor="start" font-size="8" font-weight="600" fill="#009E73">分析师</text>
  <text x="40" y="368" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">按类别统计收入，以及哪些促销</text>
  <text x="40" y="381" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">覆盖哪些产品，都基于共享的</text>
  <text x="40" y="394" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">业务名称运行。</text>
  <text x="40" y="460" text-anchor="start" font-size="8" font-weight="400" fill="#4a4a4a">演示第 9 步</text>
  <rect x="254" y="306" width="200" height="166" rx="4" ry="4" fill="#E69F00" fill-opacity="0.12" stroke="#E69F00" stroke-width="1.5"/>
  <text x="266" y="328" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">财务认证其签字的数字</text>
  <text x="266" y="350" text-anchor="start" font-size="8" font-weight="600" fill="#E69F00">财务</text>
  <text x="266" y="368" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">核心表已认证。查询未认证的表</text>
  <text x="266" y="381" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">会给出警告；在严格模式下</text>
  <text x="266" y="394" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">会被拒绝。</text>
  <text x="266" y="460" text-anchor="start" font-size="8" font-weight="400" fill="#4a4a4a">演示第 10 步</text>
  <rect x="480" y="306" width="200" height="166" rx="4" ry="4" fill="#E69F00" fill-opacity="0.12" stroke="#CC79A7" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="492" y="328" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">代理提出修正，</text>
  <text x="492" y="343" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">由负责人决定</text>
  <text x="492" y="365" text-anchor="start" font-size="8" font-weight="600" fill="#E69F00">业务负责人</text>
  <text x="492" y="383" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">修正先排入队列，不会直接</text>
  <text x="492" y="396" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">应用。一条获批准，一条附理由</text>
  <text x="492" y="409" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">被驳回。</text>
  <text x="492" y="460" text-anchor="start" font-size="8" font-weight="400" fill="#4a4a4a">演示第 11 步</text>
  <text x="668" y="460" text-anchor="end" font-size="8" font-weight="400" fill="#4a4a4a">由人决定</text>
  <rect x="706" y="306" width="200" height="166" rx="4" ry="4" fill="#D55E00" fill-opacity="0.12" stroke="#D55E00" stroke-width="1.5"/>
  <text x="718" y="328" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">拦截有风险的变更</text>
  <text x="718" y="350" text-anchor="start" font-size="8" font-weight="600" fill="#D55E00">变更控制</text>
  <text x="718" y="368" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">无效草稿校验失败并回滚，</text>
  <text x="718" y="381" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">共享模型保持原样。</text>
  <text x="718" y="460" text-anchor="start" font-size="8" font-weight="400" fill="#4a4a4a">演示第 12 步</text>
  <path d="M228,179.0 L254,179.0" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M454,179.0 L480,179.0" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M680,179.0 L706,179.0" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M228,389.0 L254,389.0" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M454,389.0 L480,389.0" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M680,389.0 L706,389.0" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M806.0,262 L806.0,284.0 L128.0,284.0 L128.0,306" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="523" width="18" height="14" rx="3" ry="3" fill="#56B4E9" fill-opacity="0.12" stroke="#56B4E9" stroke-width="1.5"/>
  <text x="64" y="534" text-anchor="start" font-size="9" font-weight="400" fill="#4a4a4a">数据团队</text>
  <rect x="170" y="523" width="18" height="14" rx="3" ry="3" fill="#E69F00" fill-opacity="0.12" stroke="#E69F00" stroke-width="1.5"/>
  <text x="194" y="534" text-anchor="start" font-size="9" font-weight="400" fill="#4a4a4a">业务负责人或财务</text>
  <rect x="340" y="523" width="18" height="14" rx="3" ry="3" fill="#009E73" fill-opacity="0.12" stroke="#009E73" stroke-width="1.5"/>
  <text x="364" y="534" text-anchor="start" font-size="9" font-weight="400" fill="#4a4a4a">分析师</text>
  <rect x="450" y="523" width="18" height="14" rx="3" ry="3" fill="#D55E00" fill-opacity="0.12" stroke="#D55E00" stroke-width="1.5"/>
  <text x="474" y="534" text-anchor="start" font-size="9" font-weight="400" fill="#4a4a4a">变更控制</text>
  <rect x="620" y="523" width="18" height="14" rx="3" ry="3" fill="#ffffff" stroke="#CC79A7" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="644" y="534" text-anchor="start" font-size="9" font-weight="400" fill="#4a4a4a">由人决定</text>
  <text x="920" y="558" text-anchor="end" font-size="9" font-weight="400" fill="#4a4a4a">来源：run_complex_demo.sh</text>
</svg>
