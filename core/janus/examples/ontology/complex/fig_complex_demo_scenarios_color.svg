<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }</style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="960" height="570" fill="#ffffff"/>
  <rect x="28" y="96" width="200" height="166" rx="4" ry="4" fill="#56B4E9" fill-opacity="0.12" stroke="#56B4E9" stroke-width="1.5"/>
  <text x="40" y="118" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">Bring an existing warehouse</text>
  <text x="40" y="133" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">into the shared model</text>
  <text x="40" y="155" text-anchor="start" font-size="8" font-weight="600" fill="#2a7fb8">DATA TEAM</text>
  <text x="40" y="173" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">Two schemas already hold the</text>
  <text x="40" y="186" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">business data. Every table is</text>
  <text x="40" y="199" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">drafted as a candidate model.</text>
  <text x="40" y="250" text-anchor="start" font-size="8" font-weight="400" fill="#4a4a4a">demo steps 1–3</text>
  <rect x="254" y="96" width="200" height="166" rx="4" ry="4" fill="#56B4E9" fill-opacity="0.12" stroke="#56B4E9" stroke-width="1.5"/>
  <text x="266" y="118" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">Link tables the way the</text>
  <text x="266" y="133" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">business uses them</text>
  <text x="266" y="155" text-anchor="start" font-size="8" font-weight="600" fill="#2a7fb8">DATA TEAM</text>
  <text x="266" y="173" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">Keys are suggested from column</text>
  <text x="266" y="186" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">names. A legacy duplicate table</text>
  <text x="266" y="199" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">makes one link ambiguous.</text>
  <text x="266" y="250" text-anchor="start" font-size="8" font-weight="400" fill="#4a4a4a">demo steps 4–5</text>
  <rect x="480" y="96" width="200" height="166" rx="4" ry="4" fill="#E69F00" fill-opacity="0.12" stroke="#CC79A7" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="492" y="118" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">Owner settles the ambiguous link</text>
  <text x="492" y="140" text-anchor="start" font-size="8" font-weight="600" fill="#E69F00">BUSINESS OWNER</text>
  <text x="492" y="158" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">The owner keeps the current</text>
  <text x="492" y="171" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">companies table, not the legacy</text>
  <text x="492" y="184" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">copy. Recorded for later.</text>
  <text x="492" y="250" text-anchor="start" font-size="8" font-weight="400" fill="#4a4a4a">demo step 6</text>
  <text x="668" y="250" text-anchor="end" font-size="8" font-weight="400" fill="#4a4a4a">a person decides</text>
  <rect x="706" y="96" width="200" height="166" rx="4" ry="4" fill="#56B4E9" fill-opacity="0.12" stroke="#56B4E9" stroke-width="1.5"/>
  <text x="718" y="118" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">Publish, then confirm nothing</text>
  <text x="718" y="133" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">has drifted from the warehouse</text>
  <text x="718" y="155" text-anchor="start" font-size="8" font-weight="600" fill="#2a7fb8">DATA TEAM</text>
  <text x="718" y="173" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">Drafts are promoted. Each schema</text>
  <text x="718" y="186" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">is compared with the warehouse:</text>
  <text x="718" y="199" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">no drift in either.</text>
  <text x="718" y="250" text-anchor="start" font-size="8" font-weight="400" fill="#4a4a4a">demo steps 7–8</text>
  <rect x="28" y="306" width="200" height="166" rx="4" ry="4" fill="#009E73" fill-opacity="0.12" stroke="#009E73" stroke-width="1.5"/>
  <text x="40" y="328" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">Analysts ask business questions</text>
  <text x="40" y="350" text-anchor="start" font-size="8" font-weight="600" fill="#009E73">ANALYSTS</text>
  <text x="40" y="368" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">Revenue by category, and which</text>
  <text x="40" y="381" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">promotions cover which products,</text>
  <text x="40" y="394" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">run on shared business names.</text>
  <text x="40" y="460" text-anchor="start" font-size="8" font-weight="400" fill="#4a4a4a">demo step 9</text>
  <rect x="254" y="306" width="200" height="166" rx="4" ry="4" fill="#E69F00" fill-opacity="0.12" stroke="#E69F00" stroke-width="1.5"/>
  <text x="266" y="328" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">Finance certifies the numbers</text>
  <text x="266" y="343" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">it signs</text>
  <text x="266" y="365" text-anchor="start" font-size="8" font-weight="600" fill="#E69F00">FINANCE</text>
  <text x="266" y="383" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">Core tables are certified. A query</text>
  <text x="266" y="396" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">over uncertified tables warns; in</text>
  <text x="266" y="409" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">strict mode it is refused.</text>
  <text x="266" y="460" text-anchor="start" font-size="8" font-weight="400" fill="#4a4a4a">demo step 10</text>
  <rect x="480" y="306" width="200" height="166" rx="4" ry="4" fill="#E69F00" fill-opacity="0.12" stroke="#CC79A7" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="492" y="328" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">An agent proposes a fix,</text>
  <text x="492" y="343" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">the owner decides</text>
  <text x="492" y="365" text-anchor="start" font-size="8" font-weight="600" fill="#E69F00">BUSINESS OWNER</text>
  <text x="492" y="383" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">The correction is queued, not</text>
  <text x="492" y="396" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">applied. One is approved, one is</text>
  <text x="492" y="409" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">rejected with a stated reason.</text>
  <text x="492" y="460" text-anchor="start" font-size="8" font-weight="400" fill="#4a4a4a">demo step 11</text>
  <text x="668" y="460" text-anchor="end" font-size="8" font-weight="400" fill="#4a4a4a">a person decides</text>
  <rect x="706" y="306" width="200" height="166" rx="4" ry="4" fill="#D55E00" fill-opacity="0.12" stroke="#D55E00" stroke-width="1.5"/>
  <text x="718" y="328" text-anchor="start" font-size="11" font-weight="600" fill="#1a1a1a">A risky change is blocked</text>
  <text x="718" y="350" text-anchor="start" font-size="8" font-weight="600" fill="#D55E00">CHANGE CONTROL</text>
  <text x="718" y="368" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">An invalid draft fails validation</text>
  <text x="718" y="381" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">and is rolled back. The shared</text>
  <text x="718" y="394" text-anchor="start" font-size="9" font-weight="400" fill="#1a1a1a">model stays as it was.</text>
  <text x="718" y="460" text-anchor="start" font-size="8" font-weight="400" fill="#4a4a4a">demo step 12</text>
  <path d="M228,179.0 L254,179.0" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M454,179.0 L480,179.0" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M680,179.0 L706,179.0" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M228,389.0 L254,389.0" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M454,389.0 L480,389.0" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M680,389.0 L706,389.0" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M806.0,262 L806.0,284.0 L128.0,284.0 L128.0,306" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="523" width="18" height="14" rx="3" ry="3" fill="#56B4E9" fill-opacity="0.12" stroke="#56B4E9" stroke-width="1.5"/>
  <text x="64" y="534" text-anchor="start" font-size="9" font-weight="400" fill="#4a4a4a">data team</text>
  <rect x="170" y="523" width="18" height="14" rx="3" ry="3" fill="#E69F00" fill-opacity="0.12" stroke="#E69F00" stroke-width="1.5"/>
  <text x="194" y="534" text-anchor="start" font-size="9" font-weight="400" fill="#4a4a4a">owner or finance</text>
  <rect x="340" y="523" width="18" height="14" rx="3" ry="3" fill="#009E73" fill-opacity="0.12" stroke="#009E73" stroke-width="1.5"/>
  <text x="364" y="534" text-anchor="start" font-size="9" font-weight="400" fill="#4a4a4a">analysts</text>
  <rect x="450" y="523" width="18" height="14" rx="3" ry="3" fill="#D55E00" fill-opacity="0.12" stroke="#D55E00" stroke-width="1.5"/>
  <text x="474" y="534" text-anchor="start" font-size="9" font-weight="400" fill="#4a4a4a">change control</text>
  <rect x="620" y="523" width="18" height="14" rx="3" ry="3" fill="#ffffff" stroke="#CC79A7" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="644" y="534" text-anchor="start" font-size="9" font-weight="400" fill="#4a4a4a">a person decides</text>
  <text x="920" y="558" text-anchor="end" font-size="9" font-weight="400" fill="#4a4a4a">source: run_complex_demo.sh</text>
</svg>
